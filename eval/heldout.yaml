# Held-out scenarios. Written after the v2 prompt was frozen and never used to change
# the prompt or to choose thresholds: they only measure. Labels follow the same
# conventions as scenarios.yaml (disease claims by non-medicines, pester-power and
# real-person deepfakes are treated as not_allowed; fixable presentation problems as
# conditional). The same author wrote the prompt and these labels, so they are
# independent of tuning, not of the author's reading of the policy.

- id: h01
  scenario: A news anchor reads out a social media claim that a singer has died, as fact. It has not been confirmed by anyone.
  expected: conditional
  clauses: [GEN-1]
- id: h02
  scenario: A 7pm crime report shows dashcam footage of a crash with visible injuries, with no warning beforehand.
  expected: conditional
  clauses: [GEN-5]
