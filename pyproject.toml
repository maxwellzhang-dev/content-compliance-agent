[project]
name = "content-compliance-agent"
version = "0.1.0"
description = "Policy Q&A agent for media compliance: LightRAG hybrid retrieval, confidence scoring, human-review routing, served to Open WebUI."
authors = [{ name = "Zhang Dingpu" }]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "lightrag-hku>=1.5.7",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
compliance-agent = "compliance_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "compliance_agent"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff.lint.per-file-ignores]
"src/compliance_agent/calibrate.py" = ["E501"]  # inline SVG markup
