clauses:
  - id: AI-1
    title: Disclosure of AI-generated content
    concepts: [ai_generated, disclosure]
    text: >-
      Audio, images or video that were created or materially altered by generative AI
      must carry a clear, visible disclosure where they appear, for example an on-screen
      label or caption. Minor edits such as colour correction, noise reduction or
      cropping do not need disclosure. Text drafted with AI assistance and then reviewed
      and edited by staff does not need a label.

  - id: AI-2
    title: Synthetic depictions of real people
    concepts: [ai_generated, real_person, consent, voice_clone]
    text: >-
      Content must not use AI to depict an identifiable real person saying or doing
      something they did not say or do, including cloned voices and face swaps, unless
      the person has given documented consent and the content is disclosed under AI-1.
      Synthetic depictions of real people are never permitted in advertising without a
      signed release, even when labelled.

  - id: AI-3
    title: AI-generated material in news
    concepts: [ai_generated, editorial_independence, accuracy]
    text: >-
      AI-generated images, video or audio must not be presented as a record of real
      events in news or current affairs. Illustrative AI imagery may be used in news only
      when it is obviously illustrative and carries a disclosure under AI-1.

  - id: GEN-1
    title: Accuracy in factual content
    concepts: [accuracy, editorial_independence]
    text: >-
      Factual content must be accurate and must not mislead. Unverified claims must be
      attributed and identified as unverified. Significant errors must be corrected
      promptly and with comparable prominence.

  - id: GEN-2
    title: Separation of editorial and commercial content
    concepts: [editorial_independence, sponsorship]
    text: >-
      Sponsors and advertisers must have no influence over the content of news or current
      affairs. News items must not be sponsored, and products must not be promoted within
      news bulletins.

  - id: GEN-3
    title: Identification of paid content
    concepts: [sponsorship, disclosure]
    text: >-
      Any content produced in exchange for payment or other benefit, including
      advertorials, product placement and paid social posts, must be clearly identified as
      sponsored at the start of the content, in words the audience will understand such as
      "Sponsored" or "Paid partnership".

  - id: GEN-4
    title: Offence and discrimination
    concepts: [hate_speech]
    text: >-
      Content must not demean or incite hostility against any person or group on the basis
      of race, religion, ethnicity, gender or disability. Stereotypes must not be used for
      humour at the expense of a racial or religious group.

  - id: GEN-5
    title: Violence and distressing material
    concepts: [violence, minors]
    text: >-
      Graphic violence, gore and distressing injury footage must be justified by editorial
      context, preceded by a warning, and kept out of programming and placements aimed at
      children.

  - id: PRV-1
    title: Privacy of individuals
    concepts: [privacy, consent]
    text: >-
      Personal data such as home addresses, phone numbers and identity card numbers must not
      be shown. Private individuals who are identifiable must have consented to appear,
      unless there is a clear public interest; otherwise faces must be blurred. Hidden
      cameras require prior approval from the compliance desk.

  - id: PRV-2
    title: Children's privacy
    concepts: [privacy, minors, consent]
    text: >-
      Identifiable children under 18 may appear only with consent from a parent or
      guardian. A child's full name, school and location must not be shown together.

  - id: ADV-1
    title: Substantiation of claims
    concepts: [substantiation, accuracy]
    text: >-
      Objective claims in advertising, including "clinically proven", "number one", "best"
      and "guaranteed", must be supported by evidence held by the advertiser before the
      advertisement airs. Claims that cannot be substantiated must be removed or reworded
      as clearly subjective opinion.

  - id: ADV-2
    title: Comparative advertising
    concepts: [comparative, substantiation]
    text: >-
      Advertisements may compare with competitors only on verifiable, like-for-like
      features. A competitor must not be named or shown in a way that denigrates it, and
      price comparisons must be current on the date of airing.

  - id: ADV-3
    title: Testimonials and endorsements
    concepts: [endorsement, real_person, consent]
    text: >-
      Testimonials must be genuine, reflect the endorser's honest experience and be held on
      file with the endorser's consent. Implying that a person endorses a product when they
      have not is prohibited.

  - id: HLT-1
    title: Medical and therapeutic claims
    concepts: [health_claim, substantiation]
    text: >-
      Advertisements must not claim that a product cures, treats or prevents any disease
      unless it is a registered medicine and the claim matches its approved indication.
      Food and supplement advertising may describe general wellbeing benefits but must not
      make disease claims.

  - id: HLT-2
    title: Weight-loss claims
    concepts: [health_claim, substantiation]
    text: >-
      Weight-loss advertising must not promise a specific amount of weight loss in a set
      time, must not claim results without diet or exercise, and must not be placed in
      content aimed at children.

  - id: HLT-3
    title: Health professionals in advertising
    concepts: [health_claim, endorsement]
    text: >-
      Advertisements must not show doctors, pharmacists or other health professionals, or
      actors presented as such, endorsing a non-medicine product.

  - id: ALC-1
    title: Alcohol advertising
    concepts: [alcohol, minors, driving]
    text: >-
      Alcohol advertising must not be aimed at or feature people who are, or appear to be,
      under 25; must not link drinking with driving, sporting success, social or sexual
      success; and must not be placed in or adjacent to children's content.

  - id: GMB-1
    title: Gambling content
    concepts: [gambling, minors, financial]
    text: >-
      Advertising for betting, casinos and other gambling services is not accepted. Lottery
      results may be reported as news. Content must not present gambling as a way to solve
      financial problems.

  - id: FIN-1
    title: Financial products and investments
    concepts: [financial, substantiation]
    text: >-
      Financial advertising must not promise or imply guaranteed returns, must state that
      the value of investments can fall, and must name the licensed entity offering the
      product. Advertising for unlicensed crypto-asset trading platforms is not accepted.

  - id: CHD-1
    title: Advertising to children
    concepts: [minors]
    text: >-
      Advertising aimed at children must not urge them to buy or to pester their parents,
      must not blur the line between programme and advertising, and must not show children
      in unsafe situations.
