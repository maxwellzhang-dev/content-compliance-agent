# Sample Broadcaster Content & Advertising Standards
#
# An ILLUSTRATIVE policy corpus written for this prototype. It is not the policy of
# any real broadcaster or regulator and is not legal advice. The wording is original;
# the themes are the ones any media compliance desk deals with.
#
# Each clause lists the concepts it governs. The concepts, and the links between
# them, form the policy graph used by the hybrid retriever.

